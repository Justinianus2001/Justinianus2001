name: profile_automation

permissions:
  contents: write

on:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

jobs:
  generate-contribute:
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub contribution grid snake
        continue-on-error: true
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake-light.svg?color_snake=#ffff00&color_dots=#4489ec,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?color_snake=#ffff00&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39

      - name: Push github-contribution-grid-snake.svg to the 'output' branch
        continue-on-error: true
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-readme:
    needs: generate-contribute
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Generate and inject quote
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: npm run generate

      - name: Commit and push changes
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git add README.md
          git commit -m "chore(profile): update daily quote [skip ci]" || echo "No changes to commit"
          git push
